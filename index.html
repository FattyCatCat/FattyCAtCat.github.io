<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="小账本 —— 一个清爽、好用的在线记账工具。记录收支、查看分类构成，数据保存在本机，支持导入导出。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小账本">
  <meta name="format-detection" content="telephone=no">
  <title>小账本 · 简易记账</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('mini-ledger.theme.v1');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (error) { /* ignore */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23146b58'/%3E%3Ctext x='32' y='44' font-size='34' font-family='serif' fill='%23fff' text-anchor='middle'%3E%E8%B4%A6%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">账</div>
        <div class="brand-text">
          <h1>小账本</h1>
          <p>认真记下每一笔，钱就清楚了</p>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色" title="切换深浅色">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <div class="menu-wrap">
          <button class="btn" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
            <span>更多</span>
          </button>
          <div class="menu" id="moreMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-menu="csv">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
              导出本月账单（CSV）
            </button>
            <button type="button" role="menuitem" data-menu="json">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>
              备份全部数据（JSON）
            </button>
            <button type="button" role="menuitem" data-menu="import">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              导入备份（JSON）
            </button>
            <div class="menu-sep" role="separator"></div>
            <button type="button" role="menuitem" class="menu-danger" data-menu="clear">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>
              清空全部数据
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="overview" aria-labelledby="monthLabel">
      <div class="month-bar">
        <div class="month-title">
          <span class="eyebrow">账本概览</span>
          <div class="month-line">
            <h2 id="monthLabel">2026年11月</h2>
            <div class="month-nav">
              <button class="month-btn" id="prevMonth" type="button" aria-label="上一个月" title="上一个月">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <button class="month-btn" id="nextMonth" type="button" aria-label="下一个月" title="下一个月">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
            <button class="text-btn" id="backToCurrent" type="button" hidden>回到本月</button>
          </div>
        </div>
        <p class="today-hint" id="todayHint"></p>
      </div>

      <div class="summary-grid">
        <article class="stat-card balance-card" id="balanceCard">
          <div class="stat-top">
            <span class="stat-label">本月结余</span>
            <span class="stat-mark" aria-hidden="true">¥</span>
          </div>
          <p class="stat-value" id="balanceValue">¥0.00</p>
          <p class="stat-sub" id="balanceSub">收入 ¥0.00 − 支出 ¥0.00</p>
        </article>

        <article class="stat-card">
          <div class="stat-top">
            <span class="stat-label">本月收入</span>
            <span class="stat-icon income" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
            </span>
          </div>
          <p class="stat-value income" id="incomeValue">¥0.00</p>
          <p class="stat-sub" id="incomeSub">还没有收入记录</p>
        </article>

        <article class="stat-card">
          <div class="stat-top">
            <span class="stat-label">本月支出</span>
            <span class="stat-icon expense" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M16 17H7V8"/></svg>
            </span>
          </div>
          <p class="stat-value expense" id="expenseValue">¥0.00</p>
          <p class="stat-sub" id="expenseSub">还没有支出记录</p>
        </article>

        <article class="stat-card">
          <div class="stat-top">
            <span class="stat-label">记账笔数</span>
            <span class="stat-icon neutral" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11M9 12h11M9 19h11"/><path d="M4 5h.01M4 12h.01M4 19h.01"/></svg>
            </span>
          </div>
          <p class="stat-value" id="countValue">0 笔</p>
          <p class="stat-sub" id="countSub">从第一笔开始吧</p>
        </article>
      </div>
    </section>

    <div class="workspace">
      <aside class="panel form-panel">
        <div class="panel-head form-head">
          <div>
            <h3 id="formTitle">记一笔</h3>
            <p class="panel-sub" id="formSub">今天花在哪儿了？</p>
          </div>
          <span class="edit-pill" id="editPill" hidden>编辑中</span>
        </div>

        <div class="segmented type-switch" id="typeSwitch" role="group" aria-label="选择收支类型">
          <button type="button" data-type="expense" class="is-active" aria-pressed="true">支出</button>
          <button type="button" data-type="income" aria-pressed="false">收入</button>
        </div>

        <div class="edit-banner" id="editBanner" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>正在修改一笔旧记录，保存后会立即更新</span>
        </div>

        <form id="recordForm" novalidate>
          <div class="amount-field">
            <label for="amountInput">金额</label>
            <div class="amount-input-wrap" id="amountWrap">
              <span aria-hidden="true">¥</span>
              <input id="amountInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-describedby="amountError">
            </div>
            <p class="form-error" id="amountError" hidden></p>
          </div>

          <div class="field-block">
            <span class="field-label" id="categoryLabel">分类</span>
            <div class="category-grid" id="categoryGrid" role="group" aria-labelledby="categoryLabel"></div>
          </div>

          <div class="field-row">
            <label class="field">
              <span class="field-label">日期</span>
              <input id="dateInput" type="date" required>
            </label>
            <label class="field">
              <span class="field-label">备注 <span class="optional">可选</span></span>
              <input id="noteInput" type="text" maxlength="40" autocomplete="off" placeholder="如：和朋友吃午饭">
            </label>
          </div>

          <button class="submit-btn" id="submitBtn" type="submit">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span id="submitText">记下这笔支出</span>
          </button>
          <button class="cancel-edit" id="cancelEdit" type="button" hidden>取消编辑</button>
        </form>

        <p class="form-hint">数据只保存在本机浏览器，记得定期备份</p>
      </aside>

      <div class="stack">
        <section class="panel chart-panel" aria-labelledby="chartTitle">
          <div class="panel-head">
            <div>
              <h3 id="chartTitle">支出构成</h3>
              <p class="panel-sub" id="chartSub">按分类看看钱都花在了哪里</p>
            </div>
            <span class="chip" id="chartChip">0 个分类</span>
          </div>
          <div class="chart-body" id="chartBody"></div>
        </section>

        <section class="panel records-panel" aria-labelledby="recordsTitle">
          <div class="list-head">
            <div class="list-title">
              <h3 id="recordsTitle">账单明细</h3>
              <span class="count-chip" id="countChip">0 笔</span>
            </div>
            <div class="filters">
              <div class="filter-tabs" id="filterTabs" role="group" aria-label="筛选收支类型">
                <button type="button" data-filter="all" class="is-active">全部</button>
                <button type="button" data-filter="expense">支出</button>
                <button type="button" data-filter="income">收入</button>
              </div>
              <label class="search">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
                <input id="searchInput" type="search" placeholder="搜索分类或备注" autocomplete="off" aria-label="搜索分类或备注">
              </label>
            </div>
          </div>

          <div class="record-list" id="recordList" aria-live="polite"></div>
        </section>
      </div>
    </div>

    <footer class="footer">
      <span>小账本 · 简单、私密、够用</span>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span>所有数据仅存储在本机浏览器</span>
    </footer>
  </div>

  <input type="file" id="importFile" accept=".json,application/json" hidden>

  <dialog class="dialog" id="confirmDialog" aria-labelledby="dialogTitle">
    <div class="dialog-body">
      <h3 id="dialogTitle">确认操作</h3>
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="dialogCancel">取消</button>
        <button class="btn btn-danger" type="button" id="dialogConfirm">确认</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/app.js"></script>
</body>
</html>
